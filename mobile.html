<!doctype html>
<html lang="fr" data-app="terrain">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Terrain</title>
<meta name="theme-color" content="#CF4434">
<meta name="description" content="Qualification et suivi de prospection — Data Links">
<link rel="manifest" href="manifest-mobile.webmanifest">
<link rel="icon" type="image/png" href="mobile-192.png">
<link rel="apple-touch-icon" href="mobile-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radar Terrain">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css?v=19">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="13" cy="13" r="6.5" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".55"/><path d="M13 13 L22 6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="18.5" cy="9" r="2.2" fill="var(--hot)"/></svg>
      Radar <small>Data Links</small>
    </div>
    <nav class="nav" id="nav">
      <button data-act="view" data-v="today">Aujourd'hui</button>
      <button data-act="view" data-v="list">Prospects</button>
      <button data-act="view" data-v="around">Autour de moi</button>
      <button data-act="view" data-v="agenda">Agenda</button>
    </nav>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Entreprise, ville, SIRET, contact, téléphone…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="top-r">
      <button class="btn btn-p new-btn" data-act="new">+ Nouveau <kbd style="background:transparent;color:inherit;border-color:currentColor;opacity:.7">N</kbd></button>
      <button class="btn btn-g btn-s" id="install-btn" data-act="install" hidden>Installer</button>
      <div class="store" id="store" data-s="loading"><i></i><span>Connexion…</span></div>
      <button class="btn btn-q" data-act="menu" aria-label="Plus d'options">•••</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-act="view" data-v="today"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5L10 3l7 6.5V17H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Aujourd'hui</button>
    <button data-act="view" data-v="list"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Prospects</button>
    <button class="plus" data-act="new"><span class="c"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><em>Visite</em></button>
    <button data-act="view" data-v="around"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 17.5s-5.5-5-5.5-8.7a5.5 5.5 0 0 1 11 0c0 3.7-5.5 8.7-5.5 8.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Autour</button>
    <button data-act="view" data-v="agenda"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Agenda</button>

  </nav>
</div>
<div id="toast"></div>
<div id="layer"></div>
<div id="auth" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
</html>
